<header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;" class="animate-fade-in">
  <div>
    <h2 style="margin-bottom: 4px; font-size: 1.8rem; font-weight: 700;">Run Audit</h2>
    <p style="margin: 0; color: var(--text-muted);">AI-Powered Shelf Execution Analytics</p>
  </div>
</header>

<div class="glass-card animate-fade-in" style="max-width: 600px; margin: 0 auto;">
  <h3 style="margin-bottom: 8px;">Run Compliance Audit</h3>
  <p style="margin-bottom: 24px;">Upload a store shelf photo to analyze against a known baseline using DINOv2 embeddings.</p>
  
  <div class="form-group">
    <label class="form-label">Reference Baseline</label>
    <select class="form-control" [(ngModel)]="selectedBaselineId">
      <option [ngValue]="null">-- Select a Baseline --</option>
      <option *ngFor="let b of baselines" [ngValue]="b.id">{{b.name || 'Baseline #' + b.id}} ({{b.shelf_capacity}} items)</option>
    </select>
  </div>
  
  <div class="form-group">
    <label class="form-label">Name (Optional)</label>
    <input type="text" class="form-control" [(ngModel)]="uploadName" placeholder="e.g. Store #102 - Morning Shift" />
  </div>

  <div class="form-group">
    <label class="form-label">Audit Image</label>
    <div style="display: flex; gap: 12px; margin-bottom: 8px;">
      <label class="btn-primary" style="flex: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Take Photo
        <input type="file" (change)="onFileSelected($event)" accept="image/*" capture="environment" style="display: none;" />
      </label>
      <label class="btn-outline" style="flex: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg> Upload File
        <input type="file" (change)="onFileSelected($event)" accept=".jpg,.jpeg,.png,.bmp" style="display: none;" />
      </label>
    </div>
    <div *ngIf="selectedFile" style="color: var(--accent-primary); font-size: 0.9em; padding: 8px; background: rgba(59, 130, 246, 0.1); border-radius: var(--radius-sm); display: flex; align-items: center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
      Selected: {{ selectedFile.name }}
    </div>
  </div>

  <div *ngIf="uploadError" style="color: var(--status-error); margin-bottom: 16px; font-weight: 500; display: flex; align-items: center;">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    {{ uploadError }}
  </div>

  <button class="btn-primary" (click)="uploadAudit()" [disabled]="!selectedFile || !selectedBaselineId || isUploading" style="width: 100%;">
    {{ isUploading ? 'Extracting DINOv2 Embeddings...' : 'Run Analysis' }}
  </button>
</div>
